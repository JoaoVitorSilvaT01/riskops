services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_PATH: /data/riskops.sqlite3
    volumes:
      - riskops_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Demo uses Django staticfiles wrapper; production uses reverse proxy.
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py evaluate && python manage.py runserver 0.0.0.0:8000 --noreload"
  alerts:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/riskops.sqlite3
    volumes:
      - riskops_data:/data
    command: python manage.py deliver_alerts --watch
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  riskops_data:
